name: Build index

# Rebuilds index.json whenever a recipe is added, edited or deleted on main,
# including edits and deletions made in GitHub's web editor.
on:
  push:
    branches: [main]
    paths: ["recipes/**", "scripts/**", ".github/workflows/index.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build index.json
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml==6.0.2
          .venv/bin/python scripts/build_index.py
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json && git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild index"
          git pull --rebase
          git push
